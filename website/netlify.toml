# Netlify build settings for the PostSynq marketing website (Next.js 15).
# In the Netlify site settings set "Base directory" to `website`; everything
# below is relative to it. Netlify detects Next.js and adds its Next.js runtime
# automatically (pages are served from its CDN, /api/newsletter runs as a function).
[build]
  command = "npm run build"
  publish = ".next"
  # No "ignore" rule: this repository holds only the website, and a
  # `git diff $CACHED_COMMIT_REF $COMMIT_REF` rule skips a branch's very first
  # build (both refs are the same commit), leaving nothing published.

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime (CDN pages + functions); declared explicitly.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables to set in the Netlify UI (never commit values):
#   NEWSLETTER_WEBHOOK_URL  receives footer newsletter sign-ups; unset = the form
#                           says sign-up is unavailable (never a fake success).
